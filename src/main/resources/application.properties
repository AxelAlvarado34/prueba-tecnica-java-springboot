spring.application.name=coworking-service

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=coworking-service
info.app.description=Microservicio de gestion de reservas de espacios de coworking

spring.jpa.hibernate.ddl-auto=update

jwt.secret=AIIIiv+GCzYcgblc3ZGJ0KjX0c+chIEoO+nXe2T772C5PULous2dNDBnWoMw2bWl
jwt.expiration-ms=3600000

logging.level.org.springframework.security=DEBUG

payment.gateway.url=http://payment-gateway-simulado.local:9999/validate

resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentGateway.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.paymentGateway.register-health-indicator=true

management.health.circuitbreakers.enabled=true

spring.profiles.active=dev