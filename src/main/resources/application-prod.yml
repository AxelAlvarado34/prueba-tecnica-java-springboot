spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  docker:
    compose:
      enabled: false

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.axel.alvarado.coworking_service: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL}